[package]
name = "bedlam"
publish = true
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Self-hosted microVM sandboxes for coding agents, placed by AMC admission"
repository = "https://github.com/caniko/bedlam"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# local+net only: the default features download the msb/libkrunfw runtime at build time and pull dbus/keyring.
microsandbox = { version = "=0.7.13", default-features = false, features = [
  "local",
  "net",
] }
rmcp = { version = "=3.8.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
